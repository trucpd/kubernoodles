name: Codex auto-fix on CI failure
on:
  workflow_run:
    workflows: ["🧪 Test building with BuildKit (Daemonless)"]
    types: [completed]

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Bước mới: Khởi tạo cấu hình OpenTelemetry cho Codex
      - name: Setup Codex config for SigNoz Observability
        run: |
          mkdir -p .codex_config
          cat <<EOF > .codex_config/config.toml
          [otel]
          log_user_prompt = true
          exporter = { otlp-grpc = { endpoint = "https://ingest.eu2.signoz.cloud", headers = { "signoz-ingestion-key" = "${{ secrets.SIGNOZ_INGESTION_KEY }}" }}}
          EOF

      - name: Run Codex autofix
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          prompt: |
            The CI pipeline failed on this commit. Diagnose the failure
            from the test output and apply the minimal fix. Do not
            refactor unrelated code.
          sandbox: workspace-write
          safety-strategy: drop-sudo
          # Chỉ định thư mục chứa file config.toml vừa tạo ở step trên
          codex-home: .codex_config
          codex-args: "--model gpt-5.4-mini"

      - name: Create fix PR
        uses: peter-evans/create-pull-request@v6
        with:
          title: "fix: auto-repair CI failure"
          body: "Automated fix generated by Codex CLI"
          branch: codex/autofix-${{ github.event.workflow_run.head_sha }}
