name: 🧪 Test building with BuildKit (Daemonless)

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: moby/buildkit:rootless
      # Quan trọng: Ghi đè entrypoint để GHA có thể chạy lệnh sh
      options: --entrypoint "" 
    permissions:
      contents: read
      packages: write

    steps:
      - name: Build and push with buildctl
        shell: sh
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.actor }}/kubernoodles/kaniko-build:test
        run: |
          # 1. Sử dụng thư mục home thực của user 'user' trong buildkit image
          # Hoặc dùng /tmp nếu bạn không chắc chắn
          DOCKER_CONFIG_DIR="/home/user/.docker"
          mkdir -p $DOCKER_CONFIG_DIR
          
          AUTH=$(echo -n ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} | base64)
          echo "{\"auths\": {\"$REGISTRY\": {\"auth\": \"$AUTH\"}}}" > $DOCKER_CONFIG_DIR/config.json

          # 2. Quan trọng: Export biến DOCKER_CONFIG để buildctl biết chỗ tìm auth
          export DOCKER_CONFIG=$DOCKER_CONFIG_DIR

          # 3. Chạy buildctl
          buildctl-daemonless.sh build \
            --frontend dockerfile.v0 \
            --local context=${{ github.server_url }}/${{ github.repository }}.git#${{ github.ref }} \
            --local dockerfile=./images/kaniko-build-test.Dockerfile \
            --output type=image,name=$REGISTRY/$IMAGE_NAME,push=true
